<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0E6B52">
<title>My Umrah Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;600&family=Amiri:wght@400;700&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Nastaliq+Urdu&display=swap">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><b>My Umrah Journey</b><span id="tagline"></span></div>
    <div class="tools">
      <span class="me" id="me"></span>
      <span class="pill" id="credits" aria-live="polite"></span>
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="ur">اردو</option>
        <option value="fr">Français</option>
        <option value="id">Bahasa Indonesia</option>
        <option value="tr">Türkçe</option>
        <option value="bn">বাংলা</option>
        <option value="mfe">Kreol Morisien</option>
      </select>
    </div>
  </header>
  <nav id="rail" class="rail" aria-label="Journey stages"></nav>
  <main id="view"></main>
  <footer class="foot" id="foot"></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>This app needs JavaScript.</noscript>
<script type="module" src="script.js"></script>
</body>
</html>
