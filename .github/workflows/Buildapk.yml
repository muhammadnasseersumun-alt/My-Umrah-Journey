name: Build My Umrah Journey APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android project files
        run: |
          test -f android-app/settings.gradle.kts
          test -f android-app/build.gradle.kts
          test -f android-app/app/build.gradle.kts
          test -f android-app/app/src/main/AndroidManifest.xml

      - name: Generate Gradle wrapper if missing
        working-directory: android-app
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Umrah-Journey-Debug-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit APK to the repository
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/My-Umrah-Journey-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/My-Umrah-Journey-debug.apk
          git commit -m "Add built debug APK [skip ci]" || echo "no change"
          git pull --rebase origin main || true
          git push origin HEAD:main
