name: Build My Umrah Journey APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download project source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configure Gradle caching
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      # 5. Verify Android SDK
      - name: Verify Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          sdkmanager --version
          adb version

      # 6. Check Android project files
      - name: Check Android project
        run: |
          test -f android-app/gradlew || {
            echo "ERROR: android-app/gradlew is missing."
            exit 1
          }

          test -f android-app/settings.gradle -o \
               -f android-app/settings.gradle.kts || {
            echo "ERROR: Gradle settings file is missing."
            exit 1
          }

          test -f android-app/app/build.gradle -o \
               -f android-app/app/build.gradle.kts || {
            echo "ERROR: Android app build file is missing."
            exit 1
          }

      # 7. Make Gradle executable
      - name: Grant Gradle permissions
        run: chmod +x android-app/gradlew

      # 8. Build debug APK
      - name: Build Debug APK
        working-directory: android-app
        run: ./gradlew --no-daemon assembleDebug

      # 9. Upload APK for download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Umrah-Journey-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

**Important:** This workflow assumes your project is a native Android Gradle project stored in `android-app`. It checks for the necessary files rather than creating a missing Android project.

## Step 2 — Save the workflow

1. Scroll down on GitHub.
2. Tap **Commit changes**.
3. Confirm the commit to the `main` branch.

GitHub should automatically start a new build.

## Step 3 — Download your APK

Open:

**[My Umrah Journey — GitHub Actions](https://github.com/muhammadnasseersumun-alt/My-Umrah-Journey/actions)**

Then:

1. Open the latest workflow run.
2. Wait for the green tick.
3. Scroll down to **Artifacts**.
4. Download `My-Umrah-Journey-APK`.
5. Extract the downloaded ZIP file.
6. Install `app-debug.apk` on your Android phone.

---

## If the build still fails

The workflow fixes the SDK setup configuration, but the complete build can still fail if the project has missing files, incompatible Gradle settings, or other errors.

**If you see another red error, send me the error message.** We can then correct the actual problem.

One important distinction: this workflow builds an APK from your existing source code. It does not create all the Umrah Journey game features from scratch, and I cannot claim the APK is error-free until the build succeeds.