name: Build My Umrah Journey APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify website files
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js

      - name: Prepare Capacitor project
        run: |
          mkdir -p www
          cp index.html styles.css script.js www/

          cat > package.json <<'EOF'
          {
            "name": "my-umrah-journey",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "6.2.1",
              "@capacitor/android": "6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.1"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.myumrahjourney.app",
            "appName": "My Umrah Journey",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Umrah-Journey-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


