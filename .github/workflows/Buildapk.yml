name: Build My Umrah Journey APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download project source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configure Gradle caching
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      # 5. Verify Android SDK
      - name: Verify Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          sdkmanager --version
          adb version

      # 6. Check Android project files
      - name: Check Android project
        run: |
          test -f android-app/gradlew || {
            echo "ERROR: android-app/gradlew is missing."
            exit 1
          }

          test -f android-app/settings.gradle -o \
               -f android-app/settings.gradle.kts || {
            echo "ERROR: Gradle settings file is missing."
            exit 1
          }

          test -f android-app/app/build.gradle -o \
               -f android-app/app/build.gradle.kts || {
            echo "ERROR: Android app build file is missing."
            exit 1
          }

      # 7. Make Gradle executable
      - name: Grant Gradle permissions
        run: chmod +x android-app/gradlew

      # 8. Build debug APK
      - name: Build Debug APK
        working-directory: android-app
        run: ./gradlew --no-daemon assembleDebug

      # 9. Upload APK for download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Umrah-Journey-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

